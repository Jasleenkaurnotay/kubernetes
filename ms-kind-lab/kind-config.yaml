kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ms-kind-lab
nodes:
  - role: control-plane
  - role: worker
    extraPortMappings:
      - containerPort: 30080 #NodePort the API gateway will use later
        hostPort: 8080
        protocol: TCP
      - containerPort: 30000 # frontend NodePort
        hostPort: 3000
        protocol: TCP
  - role: worker