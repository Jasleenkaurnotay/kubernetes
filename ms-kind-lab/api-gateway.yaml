apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: ecom-app
data:
  default.conf: |
    # kube-dns ClusterIP (kubectl -n kube-system get svc kube-dns).
    # Needed because proxy_pass uses variables, so nginx resolves names per request.
    resolver 10.96.0.10 valid=30s;

    server {
        listen 80;

        # Full names are required: nginx's resolver does not apply search suffixes.
        # Format: <service>.<namespace>.svc.cluster.local:<port>
        set $product_upstream products-service.ecom-app.svc.cluster.local:8001;
        set $user_upstream    user-service.ecom-app.svc.cluster.local:8002;
        set $cart_upstream    cart-service.ecom-app.svc.cluster.local:8003;
        set $order_upstream   order-service.ecom-app.svc.cluster.local:8004;
        set $payment_upstream payment-service.ecom-app.svc.cluster.local:8005;

        location /api/products {
            rewrite ^/api/products(.*)$ /api/v1/products$1 break;
            proxy_pass http://$product_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/users {
            rewrite ^/api/users(.*)$ /api/v1/users$1 break;
            proxy_pass http://$user_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/cart {
            rewrite ^/api/cart(.*)$ /api/v1/cart$1 break;
            proxy_pass http://$cart_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/orders {
            rewrite ^/api/orders(.*)$ /api/v1/orders$1 break;
            proxy_pass http://$order_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/payments {
            rewrite ^/api/payments(.*)$ /api/v1/payments$1 break;
            proxy_pass http://$payment_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecom-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: api-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecom-app
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080