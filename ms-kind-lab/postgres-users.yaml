apiVersion: v1
kind: Service
metadata:
  name: pg-users-svc
  namespace: ecom-app
spec:
  ports:
    - port: 5432
  clusterIP: None
  selector:
    app: postgres-users

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-users-sfs
  namespace: ecom-app
spec:
  selector:
    matchLabels:
      app: postgres-users # has to match .spec.template.metadata.labels
  serviceName: pg-users-svc
  replicas: 1
  template:
    metadata:
      labels:
        app: postgres-users # has to match .spec.selector.matchLabels
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: users-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-db-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "users"
            - name: PGDATA     # subfolder, so initdb never sees lost+found at the volume root
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: users-vol
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']   # pg_isready, user from $POSTGRES_USER
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
      - metadata:
          name: users-vol
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          resources:
            requests:
              storage: "512Mi"